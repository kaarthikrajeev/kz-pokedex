<article
  class="pokemon-card"
  role="button"
  tabindex="0"
  (click)="selected.emit(pokemon)"
  (keydown.enter)="selected.emit(pokemon)"
  (keydown.space)="selected.emit(pokemon); $event.preventDefault()"
>
  <div class="pokemon-card__header">
    <span class="pokemon-card__number">#{{ formatNumber(pokemon.id) }}</span>
    <button
      type="button"
      class="pokemon-card__favorite-toggle"
      [class.pokemon-card__favorite-toggle--active]="isFavorite"
      [attr.aria-label]="isFavorite ? 'Remove ' + pokemon.name + ' from favorites' : 'Add ' + pokemon.name + ' to favorites'"
      [attr.aria-pressed]="isFavorite"
      [title]="isFavorite ? 'Remove from favorites' : 'Add to favorites'"
      (click)="toggleFavorite($event)"
      (keydown)="$event.stopPropagation()"
    >
      {{ isFavorite ? '★' : '☆' }}
    </button>
  </div>

  <div class="pokemon-card__image-wrap">
    @if (sprite) {
      <img [src]="sprite" [alt]="pokemon.name" (error)="imageError.emit($event)" />
    } @else {
      <span class="pokemon-card__placeholder" aria-hidden="true">?</span>
    }
  </div>

  <div class="pokemon-card__footer">
    <h3>{{ pokemon.name }}</h3>
    <div class="pokemon-card__types">
      @for (type of pokemon.types.slice(0, 2); track type) {
        <span class="type {{ type }}">{{ type }}</span>
      }
    </div>
  </div>
</article>
