<div class="pokedex-app">
  <header class="topbar" aria-label="Pokédex header">
    <div class="brand">
      <span class="brand__eyebrow">Kanto Region</span>
      <h1>Pokédex</h1>
    </div>
    <div class="topbar__meta">
      <span>Tracked</span>
      <strong>{{ filteredPokemon().length }} entries</strong>
    </div>
  </header>

  <main class="pokedex-shell">
    <section class="search-panel" aria-label="Pokémon search">
      <label class="search-label" for="pokemon-search">Search Pokémon</label>
      <div class="search-box">
        <span class="search-box__icon" aria-hidden="true">⌕</span>
        <input
          id="pokemon-search"
          type="search"
          placeholder="Search by name or number..."
          aria-label="Search Pokémon"
          (input)="search($event)"
        />
      </div>
    </section>

    @if (loading()) {
      <app-pokemon-loader message="Loading Pokémon..." />
    }
    @if (error()) {
      <p class="status status--error">{{ error() }}</p>
    }

    <section class="pokemon-grid" aria-live="polite" aria-label="Pokémon list">
      @for (pokemon of filteredPokemon(); track pokemon.id) {
        <app-pokemon-card
          [pokemon]="pokemon"
          [sprite]="spriteUrl(pokemon.sprite)"
          (selected)="openPokemonDetails($event)"
          (imageError)="onImageError($event)"
        />
      }
    </section>
  </main>
</div>

<dialog id="details" popover (toggle)="onDetailsToggle($event)">
  <button
    class="dialog-close"
    popovertarget="details"
    popovertogglaction="close"
    aria-label="Close Pokémon details"
    (click)="closeDetails()"
  >
    &times;
  </button>
  <app-pokemon-details
    [pokemon]="activePokemon()"
    [loading]="detailsLoading()"
    [shiny]="isShiny()"
    [sprite]="currentSprite()"
    (shinyToggle)="toggleShiny($event)"
    (imageError)="onImageError($event)"
  />
</dialog>
